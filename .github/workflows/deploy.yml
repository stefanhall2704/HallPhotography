name: Build & Deploy Photography (self-hosted runner)

# Build + push run on GitHub's own runners (isolated). Only the deploy job runs on the homelab runner,
# which talks to the cluster with a namespace-scoped ServiceAccount (see kubernetes/ci/README.md).
# No SSH: nothing needs to reach into the machine from the internet.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Extra image tag to push'
        required: false
        default: 'latest'
      dry_run:
        description: 'Deploy job only validates (server-side dry run); changes nothing'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: stefanmhall/photography
  NAMESPACE: hallphotography

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.image_tag || 'latest' }},enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to the homelab cluster
    needs: build
    # main only (the `homelab` environment enforces this too); a dry run may also come from the migration branch
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, homelab]
    environment: homelab
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
    steps:
      - name: Checkout (manifests only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Who am I / what can I do
        run: |
          kubectl auth whoami 2>/dev/null || true
          kubectl get deploy photography -n "$NAMESPACE" -o name

      # GitHub secrets stay the source of truth for these two cluster secrets (as before), but they are now
      # applied in place (server-side apply, no delete/recreate window) and passed via 0600 temp files rather
      # than command-line arguments.
      - name: Sync app secrets
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
          SERVER_CERT: ${{ secrets.SERVER_CERT }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d=$(mktemp -d "${RUNNER_TEMP:-/tmp}/secrets.XXXXXX"); trap 'rm -rf "$d"' EXIT
          for v in SESSION_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL; do
            [ -n "${!v}" ] || { echo "GitHub secret $v is empty"; exit 1; }
            printf '%s' "${!v}" > "$d/$v"
          done
          printf '%s' "$SERVER_CERT" > "$d/server.crt"; printf '%s' "$SERVER_KEY" > "$d/server.key"
          [ -s "$d/server.crt" ] && [ -s "$d/server.key" ] || { echo "TLS cert/key secrets are empty"; exit 1; }
          # Read-only comparison: does GitHub's value equal what the cluster holds? Prints only same / DIFFERS.
          cmp_key() { # <secret> <data-key> <file>
            cur=$(kubectl get secret "$1" -n "$NAMESPACE" -o go-template="{{index .data \"$2\"}}" 2>/dev/null | base64 -d | sha256sum)
            new=$(sha256sum < "$3")
            [ "$cur" = "$new" ] && echo "  $1/$2: same as cluster" || echo "  $1/$2: DIFFERS from cluster (will be overwritten)"
          }
          echo "Comparing GitHub secrets with the cluster:"
          for k in SESSION_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL; do cmp_key photography-secrets "$k" "$d/$k"; done
          cmp_key tls-certs server.crt "$d/server.crt"; cmp_key tls-certs server.key "$d/server.key"
          mode=""; [ "$DRY_RUN" = true ] && mode="--dry-run=server"
          kubectl create secret generic photography-secrets -n "$NAMESPACE" \
            --from-file=SESSION_SECRET="$d/SESSION_SECRET" --from-file=GOOGLE_CLIENT_ID="$d/GOOGLE_CLIENT_ID" \
            --from-file=GOOGLE_CLIENT_SECRET="$d/GOOGLE_CLIENT_SECRET" --from-file=GOOGLE_CALLBACK_URL="$d/GOOGLE_CALLBACK_URL" \
            --dry-run=client -o yaml \
            | kubectl apply --server-side --force-conflicts --field-manager=ci-homelab $mode -f -
          kubectl create secret generic tls-certs -n "$NAMESPACE" \
            --from-file=server.crt="$d/server.crt" --from-file=server.key="$d/server.key" \
            --dry-run=client -o yaml \
            | kubectl apply --server-side --force-conflicts --field-manager=ci-homelab $mode -f -

      - name: Apply manifests
        run: |
          set -euo pipefail
          mode=""; [ "$DRY_RUN" = true ] && mode="--dry-run=server"
          # photography-ingress.yaml is intentionally NOT applied: that ingress is not live (the site is reached
          # through the Cloudflare tunnel -> NodePort 31055), and this pipeline deploys what is running today.
          kubectl apply $mode -f k8s/photography/photography-pvc.yaml \
                              -f k8s/photography/photography-deployment.yaml \
                              -f k8s/photography/photography-service.yaml

      - name: Roll out the new image
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # imagePullPolicy is Always, so a restart pulls the freshly pushed :latest
          kubectl rollout restart deployment/photography -n "$NAMESPACE"
          kubectl rollout status deployment/photography -n "$NAMESPACE" --timeout=300s

      - name: Check the service
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          np=$(kubectl get svc photography -n "$NAMESPACE" -o jsonpath='{.spec.ports[0].nodePort}')
          [ "$np" = 31055 ] || { echo "photography NodePort is $np, expected 31055"; exit 1; }
          # the app serves TLS on the NodePort; the runner is on the same host
          curl -fsSk --retry 6 --retry-delay 5 --retry-connrefused -o /dev/null https://127.0.0.1:31055/health
          echo "photography is serving"
