name: Deploy Photography App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'
        

env:
  REGISTRY: docker.io
  IMAGE_NAME: stefanmhall/photography
  NAMESPACE: hallphotography
  DEPLOYMENT_NAME: photography

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ github.event.inputs.image_tag || 'latest' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Create deployment script
      run: |
        cat > deploy-locally.sh << 'EOF'
        #!/bin/bash
        echo "🚀 Deploying Photography App to local Kubernetes cluster..."
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        
        # Update image in deployment
        sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/photography-deployment.yaml
        
        # Apply manifests
        kubectl apply -f k8s/photography-deployment.yaml -n ${{ env.NAMESPACE }}
        kubectl apply -f k8s/photography-service.yaml -n ${{ env.NAMESPACE }}
        
        # Wait for rollout
        echo "Waiting for deployment to complete..."
        kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=300s
        
        # Verify deployment
        echo "✅ Photography app deployed successfully!"
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        echo "Namespace: ${{ env.NAMESPACE }}"
        kubectl get pods -n ${{ env.NAMESPACE }} -l app=photography
        EOF
        chmod +x deploy-locally.sh

    - name: Upload deployment script
      uses: actions/upload-artifact@v4
      with:
        name: deployment-script
        path: deploy-locally.sh

    - name: Deployment Instructions
      run: |
        echo "🎉 Docker image built and pushed successfully!"
        echo ""
        echo "📋 To deploy to your local cluster, run these commands:"
        echo "1. Download the deployment script:"
        echo "   curl -L -o deploy-locally.sh https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
        echo ""
        echo "2. Run the deployment script:"
        echo "   chmod +x deploy-locally.sh"
        echo "   ./deploy-locally.sh"
        echo ""
        echo "🐳 Or manually update and deploy:"
        echo "   # Update the image in your deployment:"
        echo "   sed -i \"s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g\" k8s/photography-deployment.yaml"
        echo "   # Deploy to your cluster:"
        echo "   kubectl apply -f k8s/photography-deployment.yaml -n ${{ env.NAMESPACE }}"
        echo "   kubectl apply -f k8s/photography-service.yaml -n ${{ env.NAMESPACE }}"
