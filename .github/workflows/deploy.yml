name: Deploy Photography App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'
        

env:
  REGISTRY: docker.io
  IMAGE_NAME: stefanmhall/photography
  NAMESPACE: hallphotography
  DEPLOYMENT_NAME: photography

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ github.event.inputs.image_tag || 'latest' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
        kubectl config use-context ${{ secrets.KUBE_CONTEXT || 'default' }}

    - name: Deploy to Kubernetes
      run: |
        export KUBECONFIG=kubeconfig
        # Update image in deployment
        sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/photography-deployment.yaml
        # Apply manifests
        kubectl apply -f k8s/photography-deployment.yaml -n ${{ env.NAMESPACE }}
        kubectl apply -f k8s/photography-service.yaml -n ${{ env.NAMESPACE }}

    - name: Wait for rollout
      run: |
        export KUBECONFIG=kubeconfig
        echo "Waiting for deployment to complete..."
        kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=300s

    - name: Verify deployment
      run: |
        export KUBECONFIG=kubeconfig
        echo "✅ Photography app deployed successfully!"
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        echo "Namespace: ${{ env.NAMESPACE }}"
        kubectl get pods -n ${{ env.NAMESPACE }} -l app=photography
