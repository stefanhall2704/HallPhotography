name: Deploy Photography App (SSH Method)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE_NAME: stefanmhall/photography
  NAMESPACE: hallphotography
  DEPLOYMENT_NAME: photography

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ github.event.inputs.image_tag || 'latest' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          #!/bin/bash
          set -e
          
          cd /home/stefan/Documents/Personal/HallPhotography
          
          # Pull latest changes
          git pull origin main
          
          # Create secrets from GitHub secrets if they don't exist
          if ! kubectl get secret photography-secrets -n hallphotography >/dev/null 2>&1; then
            echo "Creating secrets from GitHub secrets..."
            kubectl create secret generic photography-secrets -n hallphotography \
              --from-literal=SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
              --from-literal=GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              --from-literal=GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              --from-literal=GOOGLE_CALLBACK_URL="${{ secrets.GOOGLE_CALLBACK_URL }}"
          fi
          
          if ! kubectl get secret db-secrets -n hallphotography >/dev/null 2>&1; then
            echo "Creating database secrets..."
            kubectl create secret generic db-secrets -n hallphotography \
              --from-literal=DB_USER="${{ secrets.DB_USER }}" \
              --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              --from-literal=DB_NAME="${{ secrets.DB_NAME }}"
          fi
          
          if ! kubectl get secret tls-certs -n hallphotography >/dev/null 2>&1; then
            echo "Creating TLS certificates..."
            kubectl create secret generic tls-certs -n hallphotography \
              --from-literal=server.crt="${{ secrets.SERVER_CERT }}" \
              --from-literal=server.key="${{ secrets.SERVER_KEY }}"
          fi
          
          if ! kubectl get secret calendar-secrets -n hallphotography >/dev/null 2>&1; then
            echo "Creating calendar secrets with empty values..."
            kubectl create secret generic calendar-secrets -n hallphotography \
              --from-literal=calendar-token.json='{}' \
              --from-literal=token.json='{}'
          fi
          
          # Deploy using the organized k8s structure with Cloudflare update
          chmod +x k8s/deploy-photography-with-cloudflare.sh
          ./k8s/deploy-photography-with-cloudflare.sh
          
          # Verify deployment
          echo "✅ Photography app deployed successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=photography

    - name: Verify deployment
      run: |
        echo "✅ Photography app deployment completed!"
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo "Namespace: ${{ env.NAMESPACE }}"
