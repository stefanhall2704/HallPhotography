name: Deploy Photography App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'
        

env:
  REGISTRY: docker.io
  IMAGE_NAME: stefanmhall/photography
  NAMESPACE: hallphotography
  DEPLOYMENT_NAME: photography

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ github.event.inputs.image_tag || 'latest' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build Complete
      run: |
        echo "🎉 Docker image built and pushed successfully!"
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        echo ""
        echo "📋 To deploy to your local cluster, run:"
        echo "   ./deploy-locally.sh"
        echo ""
        echo "🐳 Or manually update and deploy:"
        echo "   # Update the image in your deployment:"
        echo "   sed -i \"s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g\" k8s/photography-deployment.yaml"
        echo "   # Deploy to your cluster:"
        echo "   kubectl apply -f k8s/photography-deployment.yaml -n ${{ env.NAMESPACE }}"
        echo "   kubectl apply -f k8s/photography-service.yaml -n ${{ env.NAMESPACE }}"
