apiVersion: apps/v1
kind: Deployment
metadata:
  name: photography
  namespace: hallphotography
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: photography
  template:
    metadata:
      labels:
        app: photography
    spec:
      initContainers:
      - name: init-uploads
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "Creating required upload directories..."
          mkdir -p /app/uploads/portfolio
          mkdir -p /app/uploads/photography
          mkdir -p /app/uploads/profile_pictures
          mkdir -p /app/uploads/session_photos
          mkdir -p /app/downloads
          echo "Setting proper permissions..."
          chmod -R 755 /app/uploads
          chmod -R 755 /app/downloads
          echo "Directory initialization complete"
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: downloads
          mountPath: /app/downloads
      containers:
      - name: photography
        image: stefanmhall/photography:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        env:
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: photography-secrets
              key: SESSION_SECRET
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: photography-secrets
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: photography-secrets
              key: GOOGLE_CLIENT_SECRET
        - name: GOOGLE_CALLBACK_URL
          valueFrom:
            secretKeyRef:
              name: photography-secrets
              key: GOOGLE_CALLBACK_URL
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_NAME
        - name: DB_SSLMODE
          value: "disable"
        volumeMounts:
        - name: server-crt
          mountPath: /root/server.crt
          subPath: server.crt
          readOnly: true
        - name: server-key
          mountPath: /root/server.key
          subPath: server.key
          readOnly: true
        - name: calendar-token
          mountPath: /root/calendar/token.json
          subPath: calendar-token.json
          readOnly: true
        - name: token
          mountPath: /root/token.json
          subPath: token.json
          readOnly: true
        - name: dns-config
          mountPath: /etc/resolv.conf
          subPath: resolv.conf
          readOnly: true
        - name: uploads
          mountPath: /app/uploads
        - name: downloads
          mountPath: /app/downloads
      volumes:
      - name: server-crt
        secret:
          secretName: tls-certs
          items:
          - key: server.crt
            path: server.crt
      - name: server-key
        secret:
          secretName: tls-certs
          items:
          - key: server.key
            path: server.key
      - name: calendar-token
        secret:
          secretName: calendar-secrets
          items:
          - key: calendar-token.json
            path: calendar-token.json
      - name: token
        secret:
          secretName: calendar-secrets
          items:
          - key: token.json
            path: token.json
      - name: dns-config
        configMap:
          name: dns-config
          items:
          - key: resolv.conf
            path: resolv.conf
      - name: uploads
        persistentVolumeClaim:
          claimName: photography-uploads
      - name: downloads
        persistentVolumeClaim:
          claimName: photography-downloads
