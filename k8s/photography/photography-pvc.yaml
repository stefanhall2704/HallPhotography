apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photography-uploads
  namespace: hallphotography
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photography-downloads
  namespace: hallphotography
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
