<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hall Photography</title>
  <meta name="description" content="Login to your Hall Photography account to book sessions and manage your profile.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
/* Login page specific styles */
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

/* Background Pattern */
body::after {
  content: '';
  position: absolute;
  bottom: -30%;
  left: -10%;
  width: 40%;
  height: 150%;
  background: radial-gradient(circle, var(--soft-sage) 0%, transparent 70%);
  opacity: 0.05;
  transform: rotate(-10deg);
  z-index: -1;
}

/* Login Container */
.login-container {
  background: var(--warm-cream);
  border-radius: 25px;
  padding: var(--space-2xl);
  box-shadow: var(--shadow-strong);
  width: 100%;
  max-width: 450px;
  margin: var(--space-lg);
  position: relative;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  animation: fadeInUp 0.6s ease-out;
}

[data-theme="dark"] .login-container {
  background: var(--warm-cream);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

/* Theme Toggle */
.theme-toggle {
  position: absolute;
  top: var(--space-lg);
  right: var(--space-lg);
}

/* Social Login */
.social-login {
  margin-top: var(--space-lg);
}

/* Responsive Design */
@media (max-width: 480px) {
  .login-container {
    margin: var(--space-md);
    padding: var(--space-xl);
  }
  
  .theme-toggle {
    top: var(--space-md);
    right: var(--space-md);
  }
}
  </style>
</head>
<body data-theme="light" class="auth-page">
  <div class="login-container">
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="theme-toggle">
      <i class="fas fa-moon" id="theme-icon"></i>
    </button>

    <div class="login-form">
      <h1>Welcome Back</h1>
      <p>Sign in to your Hall Photography account</p>
      
      <form id="loginForm" method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-input"
            placeholder="Enter your username" 
            required 
          />
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input"
            placeholder="Enter your password" 
            required 
          />
        </div>
        
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-sign-in-alt"></i>
          Sign In
        </button>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <div class="social-login">
        <a href="/auth/google" class="btn btn-google">
          <i class="fab fa-google"></i>
          Continue with Google
        </a>
      </div>

      <p style="text-align: center; margin-top: var(--space-lg);">
        New here? <a href="/signup" class="link">Create an account</a>
      </p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
