<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photos - Hall Photography</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            background: #e8ecff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .drop-zone-icon {
            font-size: 64px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .drop-zone-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }

        .drop-zone-subtext {
            font-size: 14px;
            color: #666;
        }

        #file-input {
            display: none;
        }

        .file-list {
            margin-bottom: 30px;
        }

        .file-item {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            position: relative;
        }

        .file-preview {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .file-preview:hover {
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
        }

        .file-size {
            font-size: 12px;
            color: #666;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .remove-btn:hover {
            background: #c82333;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        .upload-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #5a6268;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .success-message, .error-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .file-count {
            text-align: center;
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        /* Preview Modal */
        .preview-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
        }

        .preview-modal.active {
            display: flex;
        }

        .preview-modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }

        .preview-modal-img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }

        .preview-modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }

        .preview-modal-close:hover {
            color: #667eea;
        }

        .preview-modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.3);
            color: white;
            font-size: 40px;
            padding: 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .preview-modal-nav:hover {
            background: rgba(255,255,255,0.5);
        }

        .preview-modal-prev {
            left: 20px;
        }

        .preview-modal-next {
            right: 20px;
        }

        .preview-modal-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin/photo-todo" class="back-btn">← Back to Todo List</a>
        
        <h1>📸 Upload Photos</h1>
        <p class="subtitle">Upload photos for {{.BookingType}} booking #{{.BookingID}}</p>

        <div class="success-message" id="success-message"></div>
        <div class="error-message" id="error-message"></div>

        <div class="drop-zone" id="drop-zone">
            <div class="drop-zone-icon">📁</div>
            <div class="drop-zone-text">Drag and drop photos here</div>
            <div class="drop-zone-subtext">or click to browse (supports multiple files)</div>
        </div>

        <input type="file" id="file-input" accept="image/*" multiple>

        <div class="file-count" id="file-count">No files selected</div>

        <div class="file-list" id="file-list"></div>

        <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill">0%</div>
        </div>

        <button class="upload-btn" id="upload-btn" disabled>Upload Photos</button>
    </div>

    <!-- Preview Modal -->
    <div class="preview-modal" id="preview-modal">
        <span class="preview-modal-close" id="preview-close">&times;</span>
        <button class="preview-modal-nav preview-modal-prev" id="preview-prev">‹</button>
        <div class="preview-modal-content">
            <img class="preview-modal-img" id="preview-img" src="" alt="Preview">
            <div class="preview-modal-info" id="preview-info"></div>
        </div>
        <button class="preview-modal-nav preview-modal-next" id="preview-next">›</button>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const uploadBtn = document.getElementById('upload-btn');
        const fileCount = document.getElementById('file-count');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const successMessage = document.getElementById('success-message');
        const errorMessage = document.getElementById('error-message');
        const previewModal = document.getElementById('preview-modal');
        const previewImg = document.getElementById('preview-img');
        const previewInfo = document.getElementById('preview-info');
        const previewClose = document.getElementById('preview-close');
        const previewPrev = document.getElementById('preview-prev');
        const previewNext = document.getElementById('preview-next');

        let selectedFiles = [];
        let currentPreviewIndex = 0;
        let previewUrls = [];

        const bookingType = '{{.BookingType}}';
        const bookingID = '{{.BookingID}}';

        // Click to select files
        dropZone.addEventListener('click', () => fileInput.click());

        // File input change
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Drag and drop events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            const validImages = Array.from(files).filter(file => file.type.startsWith('image/'));
            
            if (validImages.length !== files.length) {
                showError('Some files were skipped because they are not images.');
            }

            selectedFiles = [...selectedFiles, ...validImages];
            renderFileList();
            updateUploadButton();
        }

        function renderFileList() {
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '';
                fileCount.textContent = 'No files selected';
                // Clean up preview URLs
                previewUrls.forEach(url => URL.revokeObjectURL(url));
                previewUrls = [];
                return;
            }

            fileCount.textContent = `${selectedFiles.length} file${selectedFiles.length > 1 ? 's' : ''} selected`;

            // Clean up old preview URLs
            previewUrls.forEach(url => URL.revokeObjectURL(url));
            previewUrls = [];

            // Create new preview URLs
            previewUrls = selectedFiles.map(file => URL.createObjectURL(file));

            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <img class="file-preview" src="${previewUrls[index]}" alt="Preview" onclick="openPreview(${index})" title="Click to preview">
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-size">${formatFileSize(file.size)}</div>
                    </div>
                    <button class="remove-btn" onclick="removeFile(${index})">Remove</button>
                </div>
            `).join('');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderFileList();
            updateUploadButton();
        }

        function updateUploadButton() {
            uploadBtn.disabled = selectedFiles.length === 0;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 5000);
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        uploadBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('photos', file);
            });

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';
            progressBar.style.display = 'block';

            try {
                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = Math.round((e.loaded / e.total) * 100);
                        progressFill.style.width = percentComplete + '%';
                        progressFill.textContent = percentComplete + '%';
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        showSuccess(`✅ Successfully uploaded ${response.uploaded_count} photo(s)!`);
                        selectedFiles = [];
                        renderFileList();
                        updateUploadButton();
                        progressBar.style.display = 'none';
                        uploadBtn.textContent = 'Upload Photos';
                        
                        // Redirect back to todo list after 2 seconds
                        setTimeout(() => {
                            window.location.href = '/admin/photo-todo';
                        }, 2000);
                    } else {
                        showError('Upload failed: ' + xhr.statusText);
                        uploadBtn.disabled = false;
                        uploadBtn.textContent = 'Upload Photos';
                        progressBar.style.display = 'none';
                    }
                });

                xhr.addEventListener('error', () => {
                    showError('Upload failed. Please try again.');
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = 'Upload Photos';
                    progressBar.style.display = 'none';
                });

                xhr.open('POST', `/admin/booking/${bookingType}/${bookingID}/upload-photos`);
                xhr.send(formData);

            } catch (error) {
                console.error('Upload error:', error);
                showError('Upload failed: ' + error.message);
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload Photos';
                progressBar.style.display = 'none';
            }
        });

        // Preview modal functions
        function openPreview(index) {
            currentPreviewIndex = index;
            const file = selectedFiles[index];
            previewImg.src = previewUrls[index];
            previewInfo.textContent = `${file.name} (${formatFileSize(file.size)}) - ${index + 1} of ${selectedFiles.length}`;
            previewModal.classList.add('active');
        }

        function closePreview() {
            previewModal.classList.remove('active');
        }

        function nextPreview() {
            currentPreviewIndex = (currentPreviewIndex + 1) % selectedFiles.length;
            openPreview(currentPreviewIndex);
        }

        function prevPreview() {
            currentPreviewIndex = (currentPreviewIndex - 1 + selectedFiles.length) % selectedFiles.length;
            openPreview(currentPreviewIndex);
        }

        previewClose.addEventListener('click', closePreview);
        previewNext.addEventListener('click', nextPreview);
        previewPrev.addEventListener('click', prevPreview);

        previewModal.addEventListener('click', (e) => {
            if (e.target === previewModal) closePreview();
        });

        document.addEventListener('keydown', (e) => {
            if (!previewModal.classList.contains('active')) return;
            
            if (e.key === 'Escape') closePreview();
            if (e.key === 'ArrowRight') nextPreview();
            if (e.key === 'ArrowLeft') prevPreview();
        });

        // Expose functions to global scope for onclick handlers
        window.removeFile = removeFile;
        window.openPreview = openPreview;
    </script>
</body>
</html>
