<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Hall's Photography</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .session-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .session-table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e9ecef;
        }

        .session-table td {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
        }

        .session-table tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .status-awaiting_price_approval {
            background: #d1ecf1;
            color: #0c5460;
        }

        .unclaimed-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            background: #fff3cd;
            color: #856404;
            margin-left: 4px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .action-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .action-btn.secondary {
            background: #6c757d;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #5a6268;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .payment-status {
            font-size: 11px;
            margin-left: 5px;
        }

        .payment-paid {
            color: #155724;
        }

        .payment-unpaid {
            color: #856404;
        }

        .photo-status {
            font-size: 11px;
            margin-left: 5px;
        }

        .photo-uploaded {
            color: #155724;
        }

        .photo-pending {
            color: #856404;
        }

        @media (max-width: 768px) {
            .session-table {
                font-size: 12px;
            }

            .session-table th, .session-table td {
                padding: 10px 5px;
            }
        }

        /* Modal Styles */
        .confirmation-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .confirmation-modal.show {
            opacity: 1;
        }

        .confirmation-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }

        .confirmation-modal-content {
            position: relative;
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .confirmation-modal.show .confirmation-modal-content {
            transform: scale(1);
        }

        .confirmation-modal-title {
            margin: 0 0 12px 0;
            font-size: 24px;
            color: #333;
            font-weight: 600;
        }

        .confirmation-modal-message {
            margin: 0 0 24px 0;
            font-size: 16px;
            color: #666;
            line-height: 1.5;
        }

        .price-input-group {
            margin-bottom: 24px;
        }

        .price-input-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .price-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .price-input-prefix {
            position: absolute;
            left: 16px;
            font-size: 18px;
            color: #666;
            font-weight: 600;
        }

        .price-input-field {
            width: 100%;
            padding: 14px 16px 14px 36px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .price-input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .price-input-field[type="file"] {
            padding: 8px;
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            cursor: pointer;
        }
        
        .price-input-field[type="file"]:hover {
            border-color: #667eea;
            background: #fff;
        }

        .price-input-field.error {
            border-color: #dc3545;
        }

        .price-input-error {
            margin-top: 8px;
            color: #dc3545;
            font-size: 13px;
            display: none;
        }

        .price-input-error.show {
            display: block;
        }

        .price-input-hint {
            margin-top: 8px;
            color: #6c757d;
            font-size: 13px;
        }

        .confirmation-modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <!-- Admin quick-nav -->
    <div style="background:linear-gradient(135deg,#1E3A5F,#2C5F8D);padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:0;">
        <span style="color:rgba(255,255,255,0.7);font-size:13px;font-weight:600;letter-spacing:1px;">ADMIN</span>
        <a href="/profile" style="color:white;text-decoration:none;font-size:13px;padding:5px 12px;border-radius:6px;background:rgba(255,255,255,0.15);">&#8962; Profile</a>
        <a href="/admin/dashboard" style="color:white;text-decoration:none;font-size:13px;padding:5px 12px;border-radius:6px;background:rgba(255,255,255,0.35);font-weight:700;">&#128200; Dashboard</a>
        <a href="/admin/photo-todo" style="color:white;text-decoration:none;font-size:13px;padding:5px 12px;border-radius:6px;background:rgba(255,255,255,0.15);">&#128247; Photo Uploads</a>
        <a href="/calendar" style="color:white;text-decoration:none;font-size:13px;padding:5px 12px;border-radius:6px;background:rgba(255,255,255,0.15);">&#128197; Minis Calendar</a>
        <a href="/session_calendar" style="color:white;text-decoration:none;font-size:13px;padding:5px 12px;border-radius:6px;background:rgba(255,255,255,0.15);">&#128247; Session Calendar</a>
    </div>

    <div class="container">
        <h1>&#128202; Admin Dashboard</h1>
        <p class="subtitle">Comprehensive session management</p>

        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="stat-total">0</div>
                <div class="stat-label">Total Sessions</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-confirmed">0</div>
                <div class="stat-label">Confirmed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-pending">0</div>
                <div class="stat-label">Pending Approval</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-photos">0</div>
                <div class="stat-label">Need Photos</div>
            </div>
        </div>

        <div class="filters">
            <input type="text" class="search-box" id="search-box" placeholder="Search by client name...">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="confirmed">Confirmed</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="needs_photos">Needs Photos</button>
            <button class="filter-btn" data-filter="unpaid">Unpaid</button>
            <button class="filter-btn" data-filter="portfolio" onclick="showPortfolioManagement()" style="background: #28a745; color: white;">
                <i class="fas fa-images"></i> Portfolio
            </button>
            <button class="filter-btn" onclick="showOfflineCustomerModal()" style="background: #e67e22; color: white; border-color: #e67e22;">
                + Offline Customer
            </button>
        </div>

        <div id="loading" class="loading">
            <p>Loading sessions...</p>
        </div>

        <div id="content" style="display: none;">
            <div class="section">
                <h2>Regular Sessions</h2>
                <div id="sessions-table-container"></div>
            </div>

            <div class="section">
                <h2>Mini Sessions</h2>
                <div id="minis-table-container"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        let allSessions = [];
        let allMinis = [];
        let currentFilter = 'all';
        let searchQuery = '';

        async function loadAllSessions() {
            try {
                const response = await fetch('/admin/sessions/all');
                if (!response.ok) throw new Error('Failed to fetch sessions');
                
                const data = await response.json();
                allSessions = data.sessions || [];
                allMinis = data.minis || [];
                
                updateStats();
                renderSessions();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (error) {
                console.error('Error loading sessions:', error);
                document.getElementById('loading').innerHTML = '<p style="color: red;">Error loading sessions. Please try again.</p>';
            }
        }

        function updateStats() {
            const total = allSessions.length + allMinis.length;
            const confirmed = [...allSessions, ...allMinis].filter(s => s.Status === 'confirmed').length;
            const pending = [...allSessions, ...allMinis].filter(s => s.Status === 'pending' || s.Status === 'awaiting_price_approval').length;
            const needsPhotos = [...allSessions, ...allMinis].filter(s => s.Status === 'confirmed' && !s.PhotosUploaded).length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-confirmed').textContent = confirmed;
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-photos').textContent = needsPhotos;
        }

        function filterSessions(sessions) {
            let filtered = sessions;

            // Apply status filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(s => {
                    if (currentFilter === 'confirmed') return s.Status === 'confirmed';
                    if (currentFilter === 'pending') return s.Status === 'pending' || s.Status === 'awaiting_price_approval';
                    if (currentFilter === 'needs_photos') return s.Status === 'confirmed' && !s.PhotosUploaded;
                    if (currentFilter === 'unpaid') return !s.HasPaid;
                    return true;
                });
            }

            // Apply search filter
            if (searchQuery) {
                filtered = filtered.filter(s => 
                    (s.UserName || '').toLowerCase().includes(searchQuery.toLowerCase())
                );
            }

            return filtered;
        }

        function renderSessions() {
            const sessionsContainer = document.getElementById('sessions-table-container');
            const filteredSessions = filterSessions(allSessions);

            if (filteredSessions.length === 0) {
                sessionsContainer.innerHTML = '<div class="empty-state"><p>No sessions found.</p></div>';
            } else {
                sessionsContainer.innerHTML = `
                    <table class="session-table">
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>Session</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Price</th>
                                <th>Payment</th>
                                <th>Photos</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filteredSessions.map(s => `
                                <tr>
                                    <td>${s.IsOffline ? `<span class="unclaimed-badge">Unclaimed</span> ${s.UserName}` : (s.UserName || 'Unknown')}</td>
                                    <td>${s.SessionName || 'Session'}</td>
                                    <td>${formatDate(s.SessionDate)}</td>
                                    <td>${s.TimeSlot}</td>
                                    <td><span class="status-badge status-${s.Status}">${formatStatus(s.Status)}</span></td>
                                    <td>$${(s.ProposedPrice || 0).toFixed(2)}</td>
                                    <td>
                                        ${s.HasPaid ? 
                                            '<span class="payment-status payment-paid">✓ Paid</span>' : 
                                            '<span class="payment-status payment-unpaid">⏳ Unpaid</span>'}
                                    </td>
                                    <td>
                                        ${s.PhotosUploaded ? 
                                            '<span class="photo-status photo-uploaded">✓ Uploaded</span>' : 
                                            '<span class="photo-status photo-pending">⏳ Pending</span>'}
                                    </td>
                                    <td style="white-space: nowrap;">
                                        ${!s.HasPaid ? 
                                            `<button onclick="markAsPaid('session', ${s.ID}, ${s.ProposedPrice || 0}); return false;" class="action-btn" style="background: #28a745; margin-bottom: 5px;">💰 Mark Paid</button><br>` : 
                                            ''}
                                        ${s.Status === 'confirmed' ? 
                                            `<a href="/admin/booking/session/${s.ID}/upload-photos-view" class="action-btn" style="background: #667eea; margin-bottom: 5px;">📤 ${s.PhotosUploaded ? 'Upload More' : 'Upload Photos'}</a><br>` : 
                                            ''}
                                        <a href="#" onclick="viewDetails('session', ${s.ID}); return false;" class="action-btn secondary">View</a>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }

            const minisContainer = document.getElementById('minis-table-container');
            const filteredMinis = filterSessions(allMinis);

            if (filteredMinis.length === 0) {
                minisContainer.innerHTML = '<div class="empty-state"><p>No mini sessions found.</p></div>';
            } else {
                minisContainer.innerHTML = `
                    <table class="session-table">
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>Session</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Price</th>
                                <th>Payment</th>
                                <th>Photos</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filteredMinis.map(m => `
                                <tr>
                                    <td>${m.IsOffline ? `<span class="unclaimed-badge">Unclaimed</span> ${m.UserName}` : (m.UserName || 'Unknown')}</td>
                                    <td>${m.MinisName || 'Mini Session'}</td>
                                    <td>${formatDate(m.MinisDate)}</td>
                                    <td>${m.TimeSlot}</td>
                                    <td><span class="status-badge status-${m.Status}">${formatStatus(m.Status)}</span></td>
                                    <td>$${(m.ProposedPrice || 0).toFixed(2)}</td>
                                    <td>
                                        ${m.HasPaid ? 
                                            '<span class="payment-status payment-paid">✓ Paid</span>' : 
                                            '<span class="payment-status payment-unpaid">⏳ Unpaid</span>'}
                                    </td>
                                    <td>
                                        ${m.PhotosUploaded ? 
                                            '<span class="photo-status photo-uploaded">✓ Uploaded</span>' : 
                                            '<span class="photo-status photo-pending">⏳ Pending</span>'}
                                    </td>
                                    <td style="white-space: nowrap;">
                                        ${!m.HasPaid ? 
                                            `<button onclick="markAsPaid('minis', ${m.ID}, ${m.ProposedPrice || 0}); return false;" class="action-btn" style="background: #28a745; margin-bottom: 5px;">💰 Mark Paid</button><br>` : 
                                            ''}
                                        ${m.Status === 'confirmed' ? 
                                            `<a href="/admin/booking/minis/${m.ID}/upload-photos-view" class="action-btn" style="background: #667eea; margin-bottom: 5px;">📤 ${m.PhotosUploaded ? 'Upload More' : 'Upload Photos'}</a><br>` : 
                                            ''}
                                        <a href="#" onclick="viewDetails('minis', ${m.ID}); return false;" class="action-btn secondary">View</a>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        function formatStatus(status) {
            if (status === 'awaiting_price_approval') return 'Awaiting Price';
            return status.charAt(0).toUpperCase() + status.slice(1);
        }

        function viewDetails(type, id) {
            // Redirect to profile page with booking details
            window.location.href = `/profile?booking=${type}:${id}`;
        }

        // Toast notification utility
        function showToast(message, type = 'info') {
            const colors = {
                success: '#28a745',
                error: '#dc3545',
                warning: '#ffc107',
                info: '#17a2b8'
            };

            Toastify({
                text: message,
                duration: 4000,
                gravity: 'top',
                position: 'right',
                style: {
                    background: colors[type] || colors.info,
                },
                stopOnFocus: true
            }).showToast();
        }

        // Price input modal
        function showPriceInputModal(options) {
            const modal = document.createElement('div');
            modal.className = 'confirmation-modal';
            modal.innerHTML = `
                <div class="confirmation-modal-overlay"></div>
                <div class="confirmation-modal-content">
                    <h3 class="confirmation-modal-title">${options.title || 'Set Price'}</h3>
                    <p class="confirmation-modal-message">${options.message || 'Enter the session price:'}</p>
                    
                    <div class="price-input-group">
                        <label class="price-input-label">Price (USD)</label>
                        <div class="price-input-wrapper">
                            <span class="price-input-prefix">$</span>
                            <input 
                                type="number" 
                                class="price-input-field" 
                                id="priceInput" 
                                placeholder="0.00" 
                                step="0.01" 
                                min="0"
                                value="${options.defaultValue || ''}"
                            >
                        </div>
                        <div class="price-input-error" id="priceError">Please enter a valid price greater than $0</div>
                        ${options.hint ? `<div class="price-input-hint">${options.hint}</div>` : ''}
                    </div>
                    
                    <div class="confirmation-modal-actions">
                        <button class="btn btn-primary" id="confirmPriceBtn" style="background: #28a745; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px;">
                            ✓ Confirm
                        </button>
                        <button class="btn btn-outline" id="cancelPriceBtn" style="background: #6c757d; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; margin-left: 10px;">
                            Cancel
                        </button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            setTimeout(() => modal.classList.add('show'), 10);
            
            const priceInput = modal.querySelector('#priceInput');
            const priceError = modal.querySelector('#priceError');
            const confirmBtn = modal.querySelector('#confirmPriceBtn');
            
            // Focus on input
            setTimeout(() => priceInput.focus(), 100);
            
            // Validate price
            function validatePrice() {
                const value = parseFloat(priceInput.value);
                if (isNaN(value) || value <= 0) {
                    priceInput.classList.add('error');
                    priceError.classList.add('show');
                    return false;
                }
                priceInput.classList.remove('error');
                priceError.classList.remove('show');
                return true;
            }
            
            // Handle input changes
            priceInput.addEventListener('input', () => {
                if (priceInput.value) {
                    validatePrice();
                } else {
                    priceInput.classList.remove('error');
                    priceError.classList.remove('show');
                }
            });
            
            // Handle Enter key
            priceInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    confirmBtn.click();
                }
            });
            
            // Handle confirm
            confirmBtn.onclick = () => {
                if (validatePrice()) {
                    const price = parseFloat(priceInput.value);
                    modal.classList.remove('show');
                    setTimeout(() => modal.remove(), 300);
                    if (options.onConfirm) options.onConfirm(price);
                }
            };
            
            // Handle cancel
            const cancelHandler = () => {
                modal.classList.remove('show');
                setTimeout(() => modal.remove(), 300);
                if (options.onCancel) options.onCancel();
            };
            
            modal.querySelector('#cancelPriceBtn').onclick = cancelHandler;
            modal.querySelector('.confirmation-modal-overlay').onclick = cancelHandler;
        }

        async function markAsPaid(bookingType, bookingId, proposedPrice) {
            showPriceInputModal({
                title: '💰 Mark as Paid',
                message: 'Enter the payment amount received:',
                hint: `Proposed price was $${proposedPrice.toFixed(2)}`,
                defaultValue: proposedPrice.toFixed(2),
                onConfirm: async (paidAmount) => {
                    try {
                        const formData = new FormData();
                        formData.append('amount', paidAmount.toString());
                        
                        const response = await fetch(`/admin/booking/${bookingType}/${bookingId}/payment`, {
                            method: 'POST',
                            body: formData
                        });

                        if (!response.ok) {
                            const text = await response.text();
                            throw new Error(text);
                        }

                        showToast(`✅ Payment of $${paidAmount.toFixed(2)} marked as received!`, 'success');
                        
                        // Reload the dashboard
                        loadAllSessions();
                    } catch (error) {
                        console.error('Error marking payment:', error);
                        showToast('❌ Failed to mark payment: ' + error.message, 'error');
                    }
                }
            });
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderSessions();
            });
        });

        // Search box
        document.getElementById('search-box').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderSessions();
        });

        // Portfolio management function
        window.showPortfolioManagement = function() {
            const modal = createPortfolioManagementModal();
        };

        function createPortfolioManagementModal() {
            const modal = document.createElement('div');
            modal.className = 'confirmation-modal';
            modal.innerHTML = `
                <div class="confirmation-modal-overlay"></div>
                <div class="confirmation-modal-content" style="max-width: 800px; width: 95%;">
                    <h3 class="confirmation-modal-title">Portfolio Management</h3>
                    <div id="portfolio-management-content">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>Loading portfolio items...</p>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            setTimeout(() => modal.classList.add('show'), 10);
            
            // Load portfolio items
            loadPortfolioItems(modal);
            
            // Close on overlay click
            modal.querySelector('.confirmation-modal-overlay').addEventListener('click', () => {
                modal.classList.remove('show');
                setTimeout(() => modal.remove(), 300);
            });
            
            return modal;
        }

        async function loadPortfolioItems(modal) {
            try {
                const response = await fetch('/admin/portfolio');
                if (!response.ok) throw new Error('Failed to fetch portfolio items');
                
                const items = await response.json();
                renderPortfolioItems(modal, items);
            } catch (error) {
                console.error('Error loading portfolio items:', error);
                modal.querySelector('#portfolio-management-content').innerHTML = `
                    <div class="empty-state">
                        <p style="color: red;">Error loading portfolio items: ${error.message}</p>
                    </div>
                `;
            }
        }

        function renderPortfolioItems(modal, items) {
            const content = modal.querySelector('#portfolio-management-content');
            
            if (items.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <h3>No Portfolio Items</h3>
                        <p>Add your first portfolio item to showcase your work!</p>
                        <button class="action-btn" onclick="showAddPortfolioModal()" style="background: #28a745; margin-top: 15px;">
                            <i class="fas fa-plus"></i> Add Portfolio Item
                        </button>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <button class="action-btn" onclick="showAddPortfolioModal()" style="background: #28a745;">
                        <i class="fas fa-plus"></i> Add New Item
                    </button>
                </div>
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-height: 60vh; overflow-y: auto;">
                    ${items.map(item => `
                        <div class="portfolio-item-card" style="border: 1px solid #e9ecef; border-radius: 12px; overflow: hidden; background: white;">
                            <div style="position: relative;">
                                <img src="${item.ImageURL}" alt="${item.Title}" style="width: 100%; height: 200px; object-fit: cover;">
                                <div style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 12px; font-size: 12px;">
                                    ${item.Category}
                                </div>
                                <div style="position: absolute; top: 10px; left: 10px;">
                                    <label style="display: flex; align-items: center; background: rgba(255,255,255,0.9); padding: 4px 8px; border-radius: 12px; font-size: 12px;">
                                        <input type="checkbox" ${item.IsActive ? 'checked' : ''} onchange="togglePortfolioItem(${item.ID}, this.checked)" style="margin-right: 5px;">
                                        Active
                                    </label>
                                </div>
                            </div>
                            <div style="padding: 15px;">
                                <h4 style="margin: 0 0 8px 0; color: #333;">${item.Title}</h4>
                                ${item.Description ? `<p style="margin: 0 0 10px 0; color: #666; font-size: 14px;">${item.Description}</p>` : ''}
                                <div style="display: flex; gap: 8px; margin-top: 15px;">
                                    <button class="action-btn" onclick="editPortfolioItem(${item.ID})" style="background: #667eea; font-size: 12px; padding: 6px 12px;">
                                        <i class="fas fa-edit"></i> Edit
                                    </button>
                                    <button class="action-btn" onclick="deletePortfolioItem(${item.ID})" style="background: #dc3545; font-size: 12px; padding: 6px 12px;">
                                        <i class="fas fa-trash"></i> Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function togglePortfolioItem(itemId, isActive) {
            try {
                const formData = new FormData();
                formData.append('is_active', isActive.toString());

                const response = await fetch(`/admin/portfolio/${itemId}`, {
                    method: 'PUT',
                    body: formData
                });

                if (!response.ok) throw new Error('Failed to update portfolio item');

                showToast(`Portfolio item ${isActive ? 'activated' : 'deactivated'} successfully!`, 'success');
            } catch (error) {
                console.error('Error updating portfolio item:', error);
                showToast('Failed to update portfolio item: ' + error.message, 'error');
            }
        }

        function editPortfolioItem(itemId) {
            showToast('Edit functionality coming soon!', 'info');
        }

        async function deletePortfolioItem(itemId) {
            if (!confirm('Are you sure you want to delete this portfolio item? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`/admin/portfolio/${itemId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete portfolio item');

                showToast('Portfolio item deleted successfully!', 'success');
                
                // Reload the modal content
                const modal = document.querySelector('.confirmation-modal');
                if (modal) {
                    loadPortfolioItems(modal);
                }
            } catch (error) {
                console.error('Error deleting portfolio item:', error);
                showToast('Failed to delete portfolio item: ' + error.message, 'error');
            }
        }

        function showAddPortfolioModal() {
            const modal = document.createElement('div');
            modal.className = 'confirmation-modal';
            modal.innerHTML = `
                <div class="confirmation-modal-overlay"></div>
                <div class="confirmation-modal-content">
                    <h3 class="confirmation-modal-title">Add Portfolio Item</h3>
                    <form id="add-portfolio-form">
                        <div class="price-input-group">
                            <label class="price-input-label">Title *</label>
                            <input type="text" class="price-input-field" name="title" required>
                        </div>
                        <div class="price-input-group">
                            <label class="price-input-label">Description</label>
                            <textarea class="price-input-field" name="description" rows="3"></textarea>
                        </div>
                        <div class="price-input-group">
                            <label class="price-input-label">Category *</label>
                            <select class="price-input-field" name="category" required>
                                <option value="">Select Category</option>
                                <option value="portraits">Portraits</option>
                                <option value="families">Families</option>
                                <option value="events">Events</option>
                                <option value="weddings">Weddings</option>
                                <option value="maternity">Maternity</option>
                                <option value="newborn">Newborn</option>
                                <option value="seniors">Seniors</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="price-input-group">
                            <label class="price-input-label">Image File *</label>
                            <div style="position: relative;">
                                <input type="file" id="admin-portfolio-image" name="image" accept="image/*" required style="opacity: 0; position: absolute; z-index: -1;">
                                <label for="admin-portfolio-image" style="display: block; padding: 12px; border: 2px dashed #dee2e6; border-radius: 8px; background: #f8f9fa; cursor: pointer; text-align: center; transition: all 0.3s;">
                                    <i class="fas fa-cloud-upload-alt" style="font-size: 24px; color: #667eea; margin-bottom: 8px; display: block;"></i>
                                    <span style="color: #667eea; font-weight: 500;">Click to select image file</span>
                                    <div style="color: #666; font-size: 12px; margin-top: 4px;">JPEG, PNG, WebP (Max 10MB)</div>
                                </label>
                            </div>
                            <div id="admin-file-selected" style="margin-top: 8px; color: #28a745; font-size: 14px; display: none;">
                                <i class="fas fa-check-circle"></i> <span id="admin-file-name"></span>
                            </div>
                        </div>
                        <div class="price-input-group">
                            <label class="price-input-label">Sort Order</label>
                            <input type="number" class="price-input-field" name="sort_order" value="0" min="0">
                        </div>
                        <div class="confirmation-modal-actions">
                            <button type="button" class="btn btn-outline" onclick="this.closest('.confirmation-modal').remove()">Cancel</button>
                            <button type="submit" class="btn btn-primary" style="background: #28a745;">Add Item</button>
                        </div>
                    </form>
                </div>
            `;
            
            document.body.appendChild(modal);
            setTimeout(() => modal.classList.add('show'), 10);
            
            // Handle file selection feedback
            const fileInput = modal.querySelector('#admin-portfolio-image');
            const fileSelected = modal.querySelector('#admin-file-selected');
            const fileName = modal.querySelector('#admin-file-name');
            
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    fileName.textContent = file.name;
                    fileSelected.style.display = 'block';
                    
                    // Update the label to show file is selected
                    const label = modal.querySelector('label[for="admin-portfolio-image"]');
                    label.style.borderColor = '#28a745';
                    label.style.background = '#f8fff9';
                    label.innerHTML = `
                        <i class="fas fa-check-circle" style="font-size: 24px; color: #28a745; margin-bottom: 8px; display: block;"></i>
                        <span style="color: #28a745; font-weight: 500;">File selected: ${file.name}</span>
                        <div style="color: #666; font-size: 12px; margin-top: 4px;">Click to change file</div>
                    `;
                }
            });
            
            // Handle form submission
            modal.querySelector('#add-portfolio-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                
                // Validate file upload
                const fileInput = modal.querySelector('input[name="image"]');
                if (!fileInput.files.length) {
                    showToast('Please select an image file', 'error');
                    return;
                }
                
                try {
                    const response = await fetch('/admin/portfolio', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) throw new Error('Failed to add portfolio item');

                    showToast('Portfolio item added successfully!', 'success');
                    modal.remove();
                    
                    // Reload portfolio management if it's open
                    const portfolioModal = document.querySelector('.confirmation-modal');
                    if (portfolioModal && portfolioModal.querySelector('#portfolio-management-content')) {
                        loadPortfolioItems(portfolioModal);
                    }
                } catch (error) {
                    console.error('Error adding portfolio item:', error);
                    showToast('Failed to add portfolio item: ' + error.message, 'error');
                }
            });
            
            // Close on overlay click
            modal.querySelector('.confirmation-modal-overlay').addEventListener('click', () => {
                modal.remove();
            });
        }

        // Offline customer modal
        window.showOfflineCustomerModal = function() {
            const modal = document.createElement('div');
            modal.className = 'confirmation-modal';
            modal.innerHTML = `
                <div class="confirmation-modal-overlay"></div>
                <div class="confirmation-modal-content" style="max-width: 500px;">
                    <h3 class="confirmation-modal-title">Add Offline Customer</h3>
                    <p class="confirmation-modal-message">
                        Create a booking for a customer you've already photographed in person.
                        They'll verify their identity using this session date when they register.
                    </p>
                    <form id="offline-customer-form">
                        <div class="price-input-group">
                            <label class="price-input-label">First Name *</label>
                            <input type="text" class="price-input-field" name="first_name" required placeholder="e.g. Jane">
                        </div>
                        <div class="price-input-group">
                            <label class="price-input-label">Last Name *</label>
                            <input type="text" class="price-input-field" name="last_name" required placeholder="e.g. Smith">
                        </div>
                        <div class="price-input-group">
                            <label class="price-input-label">Customer Email *</label>
                            <input type="email" class="price-input-field" name="email" required placeholder="e.g. jane@example.com">
                        </div>
                        <div class="price-input-group">
                            <label class="price-input-label">Session Date *</label>
                            <input type="date" class="price-input-field" name="session_date" required>
                        </div>
                        <div class="price-input-group">
                            <label class="price-input-label">Session Type *</label>
                            <select class="price-input-field" name="session_type" required>
                                <option value="session">Regular Session</option>
                                <option value="minis">Mini Session</option>
                            </select>
                        </div>
                        <div class="confirmation-modal-actions">
                            <button type="submit" class="btn btn-primary" style="background: #e67e22; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;">
                                Create Booking
                            </button>
                            <button type="button" onclick="this.closest('.confirmation-modal').remove()" style="background: #6c757d; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; margin-left: 10px;">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            `;

            document.body.appendChild(modal);
            setTimeout(() => modal.classList.add('show'), 10);

            modal.querySelector('.confirmation-modal-overlay').addEventListener('click', () => {
                modal.classList.remove('show');
                setTimeout(() => modal.remove(), 300);
            });

            modal.querySelector('#offline-customer-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);

                try {
                    const response = await fetch('/admin/offline-customer', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        const text = await response.text();
                        throw new Error(text);
                    }

                    const result = await response.json();
                    modal.classList.remove('show');
                    setTimeout(() => modal.remove(), 300);
                    showToast(`Booking created! Now upload their photos: /admin/booking/${result.bookingType}/${result.bookingID}/upload-photos-view`, 'success');
                    loadAllSessions();
                } catch (error) {
                    console.error('Error creating offline customer:', error);
                    showToast('Failed to create booking: ' + error.message, 'error');
                }
            });
        };

        // Load sessions on page load
        loadAllSessions();
    </script>
</body>
</html>
