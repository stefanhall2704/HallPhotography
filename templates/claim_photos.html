<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Your Photos – Hall's Photography</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        h1 {
            color: #333;
            font-size: 26px;
            margin: 0 0 12px 0;
        }

        p.subtitle {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 28px 0;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input[type="date"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .error-box {
            background: #fff3f3;
            border: 1px solid #f5c6cb;
            color: #721c24;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: left;
        }

        .hint {
            margin-top: 16px;
            font-size: 13px;
            color: #999;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📷</div>
        <h1>You Have Photos Waiting!</h1>
        <p class="subtitle">
            To access your gallery, enter the date of your photography session.
            This is the day you were photographed by Caitlin.
        </p>

        {{if .Error}}
        <div class="error-box">{{.Error}}</div>
        {{end}}

        <form method="POST" action="/claim-photos">
            <div class="form-group">
                <label for="session_date">Session Date</label>
                <input type="date" id="session_date" name="session_date" required>
            </div>
            <button type="submit" class="btn-submit">Access My Photos</button>
        </form>

        <p class="hint">Not sure of the exact date? Check your texts or emails with Caitlin.</p>
        <a class="back-link" href="/">Back to Home</a>
    </div>
</body>
</html>
