<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='utf-8' />
  <title>Calendar</title>
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/main.min.css' rel='stylesheet' />
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js'></script>
  <style>
    body {
      margin: 40px 10px;
      padding: 0;
      font-family: Arial, Helvetica Neue, Helvetica, sans-serif;
      font-size: 14px;
    }
    #calendar {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Make day grid cell have vertical stacking */
    .fc .fc-daygrid-day-frame {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 2px;
      overflow-y: auto;
    }

    /* Style each event like a tag */
    .fc-daygrid-event {
      background-color: #007bff;
      color: white;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 8px;
      margin: 2px 0;
      white-space: normal !important; /* This allows line wrapping */
      word-break: break-word;
      max-width: 100%;
    }

    /* Optional: limit height of day cell to prevent overflow explosion */
    .fc-daygrid-day-events {
      max-height: 80px;
      overflow-y: auto;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id='calendar'></div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const calendarEl = document.getElementById('calendar');


    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      events: function (info, successCallback, failureCallback) {
        const start = info.startStr;
        const end = info.endStr;

        fetch(`/calendar/events?start=${start}&end=${end}`)
          .then(res => res.json())
          .then(events => {
            const formatted = events.map(event => ({
              title: event.Summary,
              start: event.Start,
              end: event.End,
              url: event.Link,
            }));
            successCallback(formatted);
          })
          .catch(failureCallback);
      }
    });


    calendar.render();
  });

  function displayEvent(eventDate, eventList) {
    const eventTile = document.querySelector(`td[data-date="${eventDate}"]`);
    const eventsContainer = eventTile?.querySelector('.fc-daygrid-day-events');

    if (eventsContainer && Array.isArray(eventList)) {
      eventList.forEach(text => {
        const eventDiv = document.createElement('div');
        eventDiv.className = 'fc-daygrid-event fc-daygrid-dot-event';
        eventDiv.innerHTML = `<div class="fc-event-main">${text}</div>`;
        eventsContainer.appendChild(eventDiv);
      });
    }
  }
</script>
</body>
</html>
