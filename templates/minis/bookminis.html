<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">

        <ul class="navbar-nav ml-auto">

                <i class="fa fa-google"></i>
              </a>
            </li>
          {{end}}
          <li class="nav-item">
            <button class="btn nav-link" id="toggle-theme">
              <i id="theme-icon" class="fa fa-moon-o"></i>
            </button>
          </li>
        </ul>
      </div>
    </nav>
    <!-- Session Modal -->
    <div class="modal fade" id="sessionModal" tabindex="-1" role="dialog" aria-labelledby="sessionModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content" id="session-modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="sessionModalLabel">Session Time Slots</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span>&times;</span>
            </button>
          </div>
          <div class="modal-body" id="modal-time-slots">
            <!-- Time slot tags go here -->
          </div>
        </div>
      </div>
    </div>
    <div id="calendar-container" class="container mt-5">
      <div id="calendar"></div>
    </div>



    <script>
    document.addEventListener('DOMContentLoaded', async function () {
      const calendarEl = document.getElementById('calendar');

      let calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',

        events: async function (fetchInfo, successCallback, failureCallback) {
          try {
            const start = fetchInfo.start.toISOString();
            const end = fetchInfo.end.toISOString();

            // Fetch all slot data
            const slotRes = await fetch(`/get/days?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
            const slotData = await slotRes.json();

            // Fetch all session metadata for this date range
            const sessionRes = await fetch(`/get/minis_sessions?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
            const sessions = await sessionRes.json(); // array of Minis objects

            // Map minis ID to session info (name, etc.)
            const sessionMap = {};
            for (const session of sessions) {
              sessionMap[session.ID] = session;
            }

            const events = [];

            // slotData: { "2025-06-17": [ "08:30 AM", ... ] }
            for (const date in slotData) {
              const slots = slotData[date];

              // Optional enhancement: determine the matching session name
              // If multiple sessions overlap on the same date, you could group or list them all
              // For now, we'll just show a default name or the first match

              let sessionName = 'Minis Session';
              let matchedSession = null;

              // Try to find a session whose Day matches this date
              for (const session of sessions) {
                if (session.Days.some(d => d.Start.startsWith(date))) {
                  sessionName = session.Name;
                  matchedSession = session;
                  break;
                }
              }

              events.push({
                title: sessionName,
                start: date,
                allDay: true,
                extendedProps: {
                  slots: slots,
                  minisSessionID: matchedSession?.ID || null
                }
              });
            }

            successCallback(events);
          } catch (err) {
            console.error("Failed to fetch calendar data:", err);
            failureCallback(err);
          }
        },

        eventClick: function (info) {
          const modalTitle = document.getElementById('sessionModalLabel');
          const modalBody = document.getElementById('modal-time-slots');
          const slots = info.event.extendedProps.slots || [];
          const sessionName = info.event.title;
          const clickedDate = info.event.startStr;

          modalTitle.textContent = sessionName;

          if (slots.length === 0) {
            modalBody.innerHTML = '<p class="text-muted">No available time slots.</p>';
            return;
          }

          // Build slot tags with click handlers
          const slotTags = slots.map(slot => `<span class="slot-tag" data-slot="${slot}">${slot}</span>`).join('');
          const formHtml = `
            <form id="booking-form">
              <input type="hidden" name="minis_session_id" value="">
              <input type="hidden" name="time_slot" value="">
              <div id="slot-container">${slotTags}</div>
              <button type="submit" class="btn btn-primary mt-3" disabled id="book-now-btn">Book Now</button>
            </form>
          `;

          modalBody.innerHTML = formHtml;

          // Figure out correct minis_session_id based on calendar event + sessions in memory
          // We'll assume only one matching session per day from earlier session mapping
          const minisSessionID = info.event.extendedProps.minisSessionID;
          if (!minisSessionID) {
            alert("No session ID found for this slot");
            return;
          }
          document.querySelector('input[name="minis_session_id"]').value = minisSessionID;

          // Add click handler for slot selection
          modalBody.querySelectorAll('.slot-tag').forEach(tag => {
            tag.addEventListener('click', function () {
              // Unselect all
              modalBody.querySelectorAll('.slot-tag').forEach(t => t.classList.remove('selected'));
              this.classList.add('selected');

              // Set hidden input
              const timeSlot = this.dataset.slot;
              document.querySelector('input[name="time_slot"]').value = timeSlot;

              // Enable button
              document.getElementById('book-now-btn').disabled = false;
            });
          });

          // Handle form submission
          document.getElementById('booking-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = new FormData(this);

            try {
              const response = await fetch('/create/book_minis', {
                method: 'POST',
                body: formData
              });

              if (response.ok) {
                alert("Booking successful!");
                $('#sessionModal').modal('hide');
                calendar.refetchEvents();
              } else {
                const errorText = await response.text();
                alert("Error: " + errorText);
              }
            } catch (err) {
              console.error("Booking error:", err);
              alert("Something went wrong!");
            }
          });

          $('#sessionModal').modal('show');
        },

        eventContent: function (arg) {
          return {
            html: `<button class="calendar-session-btn" title="${arg.event.title}">${arg.event.title}</button>`
          };
        },

        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: ''
        },

        height: 'auto'
      });

      calendar.render();
    });
    </script>


    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const toggleButton = document.getElementById('toggle-theme');
        const themeIcon = document.getElementById('theme-icon');
        const body = document.body;

        // Load user preference from localStorage
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
          body.setAttribute('data-theme', savedTheme);
          themeIcon.className = savedTheme === 'light' ? 'fa fa-moon-o' : 'fa fa-sun-o';
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          body.setAttribute('data-theme', 'dark');
          themeIcon.className = 'fa fa-sun-o';
        }

        // Toggle theme manually
        toggleButton.addEventListener('click', function() {
          const currentTheme = body.getAttribute('data-theme');
          const newTheme = currentTheme === 'light' ? 'dark' : 'light';
          body.setAttribute('data-theme', newTheme);
          localStorage.setItem('theme', newTheme); // Save user preference
          themeIcon.className = newTheme === 'light' ? 'fa fa-moon-o' : 'fa fa-sun-o';

          if (calendarInitialized) {
            calendar.render(); // rerender for proper theme adaptation
          }
        });
      });
    </script>
  </body>
