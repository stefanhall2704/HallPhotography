<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Hall Photography</title>
  <meta name="description" content="Create your Hall Photography account to book sessions and manage your profile.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
/* Signup page specific styles */
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

/* Background Pattern */
body::after {
  content: '';
  position: absolute;
  bottom: -30%;
  left: -10%;
  width: 40%;
  height: 150%;
  background: radial-gradient(circle, var(--soft-sage) 0%, transparent 70%);
  opacity: 0.05;
  transform: rotate(-10deg);
  z-index: -1;
}

/* Signup Container */
.signup-container {
  background: var(--warm-cream);
  border-radius: 25px;
  padding: var(--space-2xl);
  box-shadow: var(--shadow-strong);
  width: 100%;
  max-width: 500px;
  margin: var(--space-lg);
  position: relative;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  animation: fadeInUp 0.6s ease-out;
}

[data-theme="dark"] .signup-container {
  background: var(--warm-cream);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

/* Theme Toggle */
.theme-toggle {
  position: absolute;
  top: var(--space-lg);
  right: var(--space-lg);
}

/* Responsive Design */
@media (max-width: 480px) {
  .signup-container {
    margin: var(--space-md);
    padding: var(--space-xl);
  }
  
  .theme-toggle {
    top: var(--space-md);
    right: var(--space-md);
  }
}
  </style>
</head>
<body data-theme="light" class="auth-page">
  <div class="signup-container">
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="theme-toggle">
      <i class="fas fa-moon" id="theme-icon"></i>
    </button>

    <div class="signup-form">
      <h1>Join Hall Photography</h1>
      <p>Create your account to book sessions and manage your profile</p>

      <form method="POST" id="registerForm" action="/register/process">
        <div class="form-group">
          <label for="first_name">First Name</label>
          <input 
            type="text" 
            name="first_name" 
            id="first_name"
            class="form-input"
            placeholder="Enter your first name" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="last_name">Last Name</label>
          <input 
            type="text" 
            name="last_name" 
            id="last_name"
            class="form-input"
            placeholder="Enter your last name" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            name="email" 
            id="email"
            class="form-input"
            placeholder="Enter your email address" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            name="username" 
            id="username"
            class="form-input"
            placeholder="Choose a username" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            name="password" 
            id="password"
            class="form-input"
            placeholder="Create a strong password" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="verify_password">Confirm Password</label>
          <input 
            type="password" 
            name="verify_password" 
            id="verify_password"
            class="form-input"
            placeholder="Re-enter your password" 
            required 
          />
          <div id="password-match-indicator" class="indicator"></div>
        </div>

        <div class="form-group">
          <label for="phone_number">Phone Number</label>
          <input 
            type="tel" 
            name="phone_number" 
            id="phone_number"
            class="form-input"
            placeholder="(555) 123-4567" 
            required 
          />
        </div>

        <button type="submit" class="btn btn-primary">
          <i class="fas fa-user-plus"></i>
          Create Account
        </button>
      </form>

      <p style="text-align: center; margin-top: var(--space-lg);">
        Already have an account? <a href="/login" class="link">Sign in here</a>
      </p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
